<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ComicCraft{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/">ComicCraft</a>
    <span class="tagline">AI Comic Story Creator</span>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    Built with FastAPI, Gemini, Diffusers and FPDF.
</footer>
</body>
</html>
